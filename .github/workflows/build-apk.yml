name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform
        run: |
          flutter create --project-name foroshgah_yar --org ir.apadanasleep --platforms=android .
          mkdir -p assets/images assets/icons
          touch assets/images/.gitkeep assets/icons/.gitkeep

      - name: Fix AndroidManifest + Icon + compileSdk 35 + Persian name
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          APP_NAME = "فروشگاه یار"
          print("APP_NAME =", APP_NAME)

          p = Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in t:
              idx = t.find(">")
              t = t[:idx+1] + '\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' + t[idx+1:]
          if "usesCleartextTraffic" not in t:
              t = t.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          t = re.sub(r'\s*android:label\s*=\s*"[^"]*"', '', t)
          t = t.replace("<application", f'<application android:label="{APP_NAME}"', 1)
          p.write_text(t, encoding="utf-8")
          print("Manifest label forced to Persian")

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          (values / "strings.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              f'    <string name="app_name">{APP_NAME}</string>\n'
              f'    <string name="app_label">{APP_NAME}</string>\n'
              '</resources>\n',
              encoding="utf-8",
          )
          Path("android/app/src/main/res/values-fa").mkdir(parents=True, exist_ok=True)
          (Path("android/app/src/main/res/values-fa") / "strings.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              f'    <string name="app_name">{APP_NAME}</string>\n'
              '</resources>\n',
              encoding="utf-8",
          )

          for gp in [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]:
              if not gp.exists():
                  continue
              gt = gp.read_text(encoding="utf-8")
              gt2 = re.sub(r"compileSdk(?:Version)?\s*=?\s*\d+", "compileSdk = 35", gt)
              if gt2 == gt:
                  gt2 = re.sub(r"compileSdkVersion\s+\d+", "compileSdk 35", gt)
              if "compileSdk" not in gt2 and "android {" in gt2:
                  gt2 = gt2.replace("android {", "android {\n    compileSdk = 35", 1)
              if "resValue" not in gt2 and "defaultConfig" in gt2:
                  gt2 = re.sub(
                      r'(defaultConfig\s*\{)',
                      r'\1\n        resValue "string", "app_name", "' + APP_NAME + r'"',
                      gt2,
                      count=1,
                  )
              gp.write_text(gt2, encoding="utf-8")
              print("gradle ok", gp)
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          if [ -f assets/icons/app_icon.png ]; then
            for folder in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              dir="android/app/src/main/res/mipmap-$folder"
              mkdir -p "$dir"
              cp assets/icons/app_icon.png "$dir/ic_launcher.png"
              cp assets/icons/app_icon.png "$dir/ic_launcher_round.png"
            done
            echo "Custom icon applied"
          else
            echo "WARNING: icon not found"
            ls -la assets/icons/ || true
          fi
          echo "=== strings ==="
          cat android/app/src/main/res/values/strings.xml
          grep -n "label" android/app/src/main/AndroidManifest.xml || true

      - name: Sign with stable keystore
        run: |
          set -e
          if [ -f android_templates/foroshgah-yar.jks ] && [ -f android_templates/inject_signing.py ]; then
            mkdir -p android/app
            cp -f android_templates/foroshgah-yar.jks android/app/foroshgah-yar.jks
            python3 android_templates/inject_signing.py
            echo "Signing injected"
            grep -n "signingConfig\|storeFile" android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          else
            echo "WARNING: keystore missing - APK will use debug sign"
            ls -la android_templates/ || true
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foroshgah-yar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
